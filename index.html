<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>index</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="menu-container"></div>
    <h3 class="alert alert-primary mt-4" role="alert">หน้าหลัก</h3>
    <div class="alert alert-primary text-start" role="alert">
        nuttapat tresavut
    </div>
    <div class="text-end">
    <a class="btn btn-primary" href="https://www.google.com/">Google</a>
    </div>

    <div class="container text-center mt-4">
        <div class="row">
          <div class="col bg-primary-subtle">
            <img src="img/cat2.jpg" class="img-fluid">
            CAT  
          </div>
          <div class="col bg-success-subtle">
            <img src="img/dog4.jpg" class="img-fluid">
            DOG
          </div>
          <div class="col bg-info-subtle">
            <h4 class="mt-4">register</h4>

            <form class="text-start">
                <div class="mb-3">
                    <label class="form-label">Firstname</label>
                    <input type="text" class="form-control" id="firstname" required placeholder="input firstname">
                <div class="mb-3">
                    <label class="form-label">Lastname</label>
                    <input type="text" class="form-control" id="lastname" required placeholder="input lastname">
                <div class="mb-3">
                    <label class="form-label">Telephone</label>
                    <input type="tel" class="form-control" id="telephone" required placeholder="ex xxx-xxx-xxxx">
                <div class="mb-3">
                    <label class="form-label">Province</label>
                <select class="form-select" aria-label="Default select example" required>
                        <option selected>เลือกจังหวัด</option>
                        <option value="1">ชลบุรี</option>
                        <option value="2">ระยอง</option>
                        <option value="3">เชียงใหม่</option>
                      </select>

                <div class="mb-3">
                  <label class="form-label">Email address</label>
                  <input type="email" class="form-control" id="email" required placeholder="input email address">
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input type="password" class="form-control" id="pw" required placeholder="input password">
                </div>
                <div class="text-center">  
                  <input type="checkbox" class="form-check-input" id="exampleCheck1">
                  <label class="form-check-label" for="exampleCheck1">Check me out</label>
                </div>
                <div class="mb-3">  
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button type="reset" class="btn btn-secondary">Cancel</button>
                </div>
              </form>
          </div>
        </div>
      </div>
    <div class="container">
      <script src="js/bootstrap.bundle.min.js"></script>
      <script src="js/menu.js"></script>  
</body>
</html>
